spring:
  application:
    name: grp8-panier-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gr8_panier_db
    username: gr8_panier_user
    password: dbpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8188

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8196/eureka