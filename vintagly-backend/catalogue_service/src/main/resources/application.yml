spring:
  application:
    name: catalogue-service

  datasource:
    url: jdbc:postgresql://localhost:5432/gr8_catalogue_db
    username: gr8_catalogue_user
    password: dbpass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/myrealm
          # jwk-set-uri: http://localhost:8080/realms/myrealm/protocol/openid-connect/certs

upload:
  dir: src/main/resources/static/uploads

server:
  port: 8190

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8196/eureka
