spring:
  application:
    name: catalogue-service

  datasource:
    url: jdbc:postgresql://localhost:5432/grp8_catalogue_db
    username: postgres
    password: 11aminalina
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

