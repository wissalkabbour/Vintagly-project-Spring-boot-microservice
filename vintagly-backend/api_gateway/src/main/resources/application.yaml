server:
  port: 8195
  forward-headers-strategy: framework   # indispensable pour transférer Authorization

spring:
  application:
    name: api_gateway

  cloud:
    gateway:
      # 🔥 CORS GLOBAL
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true

      default-filters:
        - TokenRelay
        - RemoveRequestHeader=Cookie
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        - id: catalogue-service
          uri: lb://catalogue-service
          predicates:
            - Path=/api/catalogue/**

        - id: panier-service
          uri: lb://panier-service
          predicates:
            - Path=/panier/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payment/**

        - id: demande-service
          uri: lb://demande-service
          predicates:
            - Path=/api/demandes/**

        # UPLOADS static files
        - id: catalogue-static-uploads
          uri: lb://catalogue-service
          predicates:
            - Path=/uploads/**
          filters:
            - PreserveHostHeader

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/myrealm

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8196/eureka

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
