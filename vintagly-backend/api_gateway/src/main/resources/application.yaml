server:
  port: 8195
  forward-headers-strategy: framework   # 🔥 indispensable pour transférer Authorization

spring:
  application:
    name: api_gateway

  cloud:
    gateway:
      default-filters:
        - TokenRelay                    # 🔥 TRANSFÈRE le token aux microservices
        - RemoveRequestHeader=Cookie    # 🔒 évite les conflits avec Keycloak

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ---- AUTH service (public) ----
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**

        # ---- CATALOGUE service (protégé) ----
        - id: catalogue-service
          uri: lb://catalogue-service
          predicates:
            - Path=/api/catalogue/**
        - id: catalogue-service-images
          uri: lb://catalogue-service
          predicates:
            - Path=/uploads/**
          filters:
            - RewritePath=/uploads/(?<segment>.*),/uploads/${segment}
        - id: panier-service
          uri: lb://panier-service
          predicates:
            - Path=/api/panier/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
        - id: demande-service
          uri: lb://demande-service
          predicates:
            - Path=/api/demandes/**
        # ---- UPLOADS (PUBLIC) ----
        - id: catalogue-static-uploads
          uri: http://localhost:8084
          predicates:
            - Path=/uploads/**
          filters:
            - PreserveHostHeader                
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/myrealm
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
